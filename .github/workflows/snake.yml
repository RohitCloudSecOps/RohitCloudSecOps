# ─────────────────────────────────────────────────────────────────────────────
# GitHub Actions Workflow: Contribution Snake Animation
# Powered by: https://github.com/Platane/snk
#
# SETUP INSTRUCTIONS
# ──────────────────
# 1. In your GitHub profile repo (RohitCloudSecOps/RohitCloudSecOps),
#    create the folder:  .github/workflows/
#
# 2. Place THIS FILE at:
#    .github/workflows/snake.yml
#
# 3. Go to your repo → Settings → Actions → General
#    Under "Workflow permissions" → select "Read and write permissions"
#    Click Save.
#
# 4. Push the file. The workflow will run automatically.
#    You can also trigger it manually: Actions tab → "Generate Snake" → Run workflow
#
# 5. After the first successful run, the SVGs are committed to the `output` branch.
#    The README will automatically show the animation.
# ─────────────────────────────────────────────────────────────────────────────

name: Generate Snake

on:
  # Runs automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"

  # Lets you trigger it manually from the Actions tab
  workflow_dispatch:

  # Also runs on every push to main (so the snake updates when you push)
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Step 1: Generate both light and dark SVG snake animations
      - name: Generate contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Step 2: Push the generated SVGs to the `output` branch
      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
